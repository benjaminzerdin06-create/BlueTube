name: desktop

# Build the desktop app (Windows + Linux), smoke-test the Linux build, upload both as artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish linux-x64 and win-x64
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish src/BlueTube.Desktop -c Release -r $rid --self-contained -o artifacts/BlueTube-$rid
          done

      - name: Check Windows build (no console window, Blazor script included)
        run: |
          # PE optional header "Subsystem": 2 = GUI (no console), 3 = console.
          sub=$(python3 -c "import struct,sys;b=open(sys.argv[1],'rb').read();pe=struct.unpack_from('<I',b,0x3C)[0];print(struct.unpack_from('<H',b,pe+24+68)[0])" artifacts/BlueTube-win-x64/BlueTube.exe)
          echo "BlueTube.exe subsystem: $sub"
          test "$sub" = "2"
          # OutputType=WinExe drops this file. See BlueTube.Desktop.csproj.
          grep -q '_framework/blazor.web' artifacts/BlueTube-win-x64/BlueTube.staticwebassets.endpoints.json

      - name: Smoke test (Linux build starts and serves its files)
        run: |
          data=$(mktemp -d)
          ./artifacts/BlueTube-linux-x64/BlueTube --no-window --data "$data" > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5217/ && break; sleep 1; done
          for u in / /_framework/blazor.web.js /_content/BlueTube.UI/app.css /_content/BlueTube.UI/app.js /BlueTube.styles.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:5217$u")
            echo "$code $u"
            test "$code" = "200"
          done
          kill %1
          cat app.log

      - uses: actions/upload-artifact@v4
        with:
          name: BlueTube-linux-x64
          path: artifacts/BlueTube-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: BlueTube-win-x64
          path: artifacts/BlueTube-win-x64
